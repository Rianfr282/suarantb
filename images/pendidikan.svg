  </defs>
  <rect width="800" height="450" fill="url(#bgPend)" />
  <!-- Sun & Solar Panels -->
  <circle cx="680" cy="100" r="70" fill="#f39c12" />
  <g stroke="#f39c12" stroke-width="4" opacity="0.7">
